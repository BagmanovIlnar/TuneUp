[package]
name = "tuneup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
sysinfo.workspace = true
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
# Linux: `ksni` (StatusNotifierItem over D-Bus) instead of GTK AppIndicator —
# works with eframe/winit on Wayland without a separate gtk::main thread.
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
tuneup-core = { path = "../../crates/tuneup-core" }
tuneup-platform = { path = "../../crates/tuneup-platform" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "windows")'.dependencies]
tuneup-windows = { path = "../../crates/tuneup-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
tuneup-macos = { path = "../../crates/tuneup-macos" }
winit = { version = "0.30.13", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tuneup-linux = { path = "../../crates/tuneup-linux" }
# eframe pins winit/glutin with default-features=false (only egl+wgl).
# Without x11/wayland: compile fails (winit) or runtime Glutin "native window
# is not supported" on Wayland/X11 sessions.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
glutin = { version = "0.32.3", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
glutin-winit = { version = "0.5.0", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
