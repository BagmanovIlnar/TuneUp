[workspace]
resolver = "3"
members = [
    "apps/tuneup",
    "apps/tuneup-helper",
    "crates/tuneup-core",
    "crates/tuneup-linux",
    "crates/tuneup-macos",
    "crates/tuneup-platform",
    "crates/tuneup-windows",
]
default-members = ["apps/tuneup"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
windows-sys = "0.61.2"
winreg = "0.56.0"
